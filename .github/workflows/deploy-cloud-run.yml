# Production API on Google Cloud Run. Runs on every push to master.
# The deploy job is gated on the same unit tests + client secret scan that
# ci.yml runs, so a red test suite can no longer ship to production.
# Requires repo secret: GCP_SA_KEY (JSON for a service account with Cloud Run +
# Cloud Build permissions for source deploys) — see .planning/RUNBOOK_DEPLOY.md.

name: Deploy Cloud Run (API)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-master
  cancel-in-progress: false

env:
  GCP_PROJECT: vieforce-vpi
  REGION: asia-southeast1
  SERVICE: vieforce-hq-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Client bundle secret scan (SEC-04)
        run: node scripts/ci-scan-client.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy service from source and route traffic to latest
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT"
          gcloud run deploy "$SERVICE" --source . --region "$REGION" --quiet
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
