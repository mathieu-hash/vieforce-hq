<!doctype html>
<html data-theme="">
<head>
<meta charset="utf-8">
<title>Margin Explorer page — mock harness</title>
<link rel="stylesheet" href="/css/mexp2.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
<style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  /* Vienovo Brand — Dark Mode */
  --bg: #00293A;
  --bg2: #003347;
  --bg3: #004058;
  --bg4: #004A64;
  --surface: rgba(0,50,72,0.55);
  --surface-solid: #003248;
  --surface-hover: rgba(0,60,85,0.7);
  --glass: rgba(0,42,62,0.4);
  --glass-border: rgba(255,255,255,0.07);
  --glass-border-hover: rgba(255,255,255,0.12);
  --border: rgba(255,255,255,0.10);      /* solid control border — referenced app-wide, sits between --glass-border and --divider */
  --surface2: rgba(0,60,85,0.55);        /* second-level surface (tracks, table separators) — a step lighter than --surface */
  --navy: #004A64;
  --blue: #00AEEF;
  --blue2: #00A8CF;
  --cyan: #00C4E8;
  --green: #97D700;
  --green2: #7AB800;
  --red: #EF4444;
  --red2: #FF6B6B;
  --gold: #FFC72C;
  --amber: #F58320;
  --text: #F0F4FA;
  --text2: rgba(240,244,250,0.72);
  --text3: rgba(240,244,250,0.55);  /* WCAG AA — was 0.35; bumped for period buttons / topbar-sub contrast */
  --text4: rgba(240,244,250,0.42);  /* WCAG AA — was 0.18; bumped for sidebar section titles */
  --divider: rgba(255,255,255,0.10);
  --glow-blue: rgba(0,174,239,0.12);
  --glow-green: rgba(151,215,0,0.1);
  --glow-red: rgba(239,68,68,0.1);
  --glow-gold: rgba(255,199,44,0.1);
  --r: 12px;
  --r-sm: 8px;
  --r-lg: 16px;
  --font: 'Montserrat', system-ui, sans-serif;
  --mono: 'Source Code Pro', monospace;
  --sidebar-w: 240px;
  --sidebar-collapsed: 64px;
  --header-h: 56px;
  --transition: 0.3s cubic-bezier(0.22,1,0.36,1);
}

/* ===== LIGHT THEME — Vienovo Brand ===== */
[data-theme="light"] {
  --bg: #F5F5F5;
  --bg2: #EEEFF2;
  --bg3: #E4E6EB;
  --bg4: #D8DCE4;
  --surface: rgba(255,255,255,0.9);
  --surface-solid: #FFFFFF;
  --surface-hover: rgba(255,255,255,0.98);
  --glass: rgba(255,255,255,0.7);
  --glass-border: rgba(0,74,100,0.1);
  --glass-border-hover: rgba(0,74,100,0.16);
  --border: rgba(0,74,100,0.14);
  --surface2: rgba(0,74,100,0.06);
  --navy: #004A64;
  --blue: #00AEEF;
  --blue2: #00A8CF;
  --cyan: #0098C8;
  --green: #7AB800;
  --green2: #5E9600;
  --red: #DC2626;
  --red2: #EF4444;
  --gold: #D7AB26;
  --amber: #F58320;
  --text: #1A1A1A;
  --text2: #444444;
  --text3: rgba(68,68,68,0.78);  /* WCAG AA — was 0.6 */
  --text4: rgba(68,68,68,0.58);  /* WCAG AA — was 0.3 */
  --divider: rgba(0,74,100,0.12);
  --glow-blue: rgba(0,174,239,0.08);
  --glow-green: rgba(151,215,0,0.08);
  --glow-red: rgba(220,38,38,0.07);
  --glow-gold: rgba(215,171,38,0.08);
}
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Montserrat, system-ui, sans-serif; }
  .content { overflow-y: auto; height: 100vh; padding: 24px 28px 32px; box-sizing: border-box; }
  .page { display: none; } .page.active { display: block; }
  .bar { display: flex; gap: 8px; padding: 8px 20px; flex-wrap: wrap; position: fixed; bottom: 0; left: 0; right: 0; z-index: 99; background: rgba(0,0,0,.6); }
  .bar button { font: 700 11px system-ui; padding: 5px 9px; }
  #log { font: 10px/1.4 ui-monospace, monospace; color: #9fb; max-height: 60px; overflow: auto; white-space: pre-wrap; flex: 1 1 100%; }
</style>
</head>
<body>
<div class="content"><div class="page active" id="pg-margin-explorer"></div></div>
<div class="bar">
  <button data-do="scn:happy">scenario happy</button>
  <button data-do="scn:trust-signals">scenario trust-signals</button>
  <button data-do="scn:bridge-unavailable">scenario bridge-unavailable</button>
  <button data-do="scn:empty-scope">scenario empty-scope</button>
  <button data-do="fail:diss">fail phase B once</button>
  <button data-do="fail:core">fail phase A once</button>
  <button data-do="theme">toggle theme</button>
  <button data-do="reenter">re-enter page (loadMarginExplorer)</button>
  <div id="log"></div>
</div>

<script>
  // ---- shell stubs: the globals the page reads (app.html / js/api.js) ----
  var PD = 'QTD', VF_REF_MONTH = '', RG = 'ALL';
  function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
  function fc(n){if(n==null||isNaN(n))return'₱0';n=+n;if(Math.abs(n)>=1e6)return'₱'+(n/1e6).toFixed(1)+'M';if(Math.abs(n)>=1e3)return'₱'+(n/1e3).toFixed(0)+'K';return'₱'+n.toFixed(0)}
  function fcn(n){if(n==null||isNaN(n))return'0';return(+n).toLocaleString('en-US',{maximumFractionDigits:0})}
  function exportTableToXlsx(t, name){ say('exportTableToXlsx(' + name + ') rows=' + t.querySelectorAll('tr').length); }
  var LOG = document.getElementById('log');
  function say(s){ LOG.textContent = (new Date().toTimeString().slice(0,8) + ' ' + s + '\n' + LOG.textContent).slice(0, 3000); }
  var SCN = 'happy', FAIL = { core: false, diss: false }, CALLS = 0;
  function apiFetch(endpoint, params) {
    var n = ++CALLS, phase = (params && params.include === 'dissection') ? 'diss' : 'core';
    say('apiFetch #' + n + ' ' + phase + ' ' + JSON.stringify(params));
    return new Promise(function (res, rej) {
      setTimeout(function () {
        if (FAIL[phase]) { FAIL[phase] = false; say('  -> #' + n + ' FAIL'); rej(new Error('API error: 504 upstream timeout (mock)')); return; }
        var M = window.MEXP2.mock;
        res(phase === 'diss' ? M.rawDiss(SCN, params) : M.rawCore(SCN, params));
      }, phase === 'diss' ? 900 : 350);
    });
  }
  function apiPost(endpoint, body) {
    say('apiPost ' + endpoint + ' digest keys=' + Object.keys(body.digest).join(','));
    return new Promise(function (res) { setTimeout(function () { res({ text: 'MOCK AI: scope ' + body.digest.scope + ' · headline ' + JSON.stringify(body.digest.headline && body.digest.headline.discount_overlay) }); }, 300); });
  }
</script>
<script src="/js/mexp2-contract.js"></script>
<script src="/js/mexp2-wire.js"></script>
<script src="/js/mexp2-fmt.js"></script>
<script src="/js/mexp2-store.js"></script>
<script src="/js/mexp2-api.js"></script>
<script src="/js/mexp2-svg.js"></script>
<script src="/js/mexp2-charts.js"></script>
<script src="/test/mexp2-mock.js"></script>
<script src="/js/mexp2-url.js"></script>
<script src="/js/mexp2-panel-kpi.js"></script>
<script src="/js/mexp2-panel-g2n.js"></script>
<script src="/js/mexp2-panel-bridge.js"></script>
<script src="/js/mexp2-panel-insight.js"></script>
<script src="/js/mexp2-panel-trendmatrix.js"></script>
<script src="/js/mexp2-controller.js"></script>
<script src="/js/mexp2-adapter.js"></script>
<script src="/js/margin-explorer-matrix.js"></script>
<script src="/js/margin-explorer-dissection.js"></script>
<script src="/js/margin-explorer-netbridge.js"></script>
<script src="/js/margin-explorer.js"></script>
<script>
  document.querySelector('.bar').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var d = b.getAttribute('data-do');
    if (d === 'theme') { var r = document.documentElement; r.setAttribute('data-theme', r.getAttribute('data-theme') === 'light' ? '' : 'light'); return; }
    if (d === 'reenter') { loadMarginExplorer(); return; }
    if (d.indexOf('scn:') === 0) { SCN = d.slice(4); say('scenario -> ' + SCN + ' (click Refresh)'); return; }
    if (d.indexOf('fail:') === 0) { FAIL[d.slice(5)] = true; say('next ' + d.slice(5) + ' fetch will fail (click Refresh)'); return; }
  });
  window.addEventListener('error', function (e) { say('ERROR ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
  loadMarginExplorer();
</script>
</body>
</html>
